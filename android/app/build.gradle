apply plugin: 'com.android.application'

android {
    namespace 'org.heavenclient.android'
    compileSdk 34
    ndkVersion '27.3.13750724'

    defaultConfig {
        applicationId 'org.heavenclient.android'
        minSdk 24
        targetSdk 34

        // CI passes these in from the git tag, so a release cannot claim a
        // version that disagrees with the tag it was built from. A local
        // build gets the fallbacks and never pretends to be a release.
        versionCode System.getenv('HC_VERSION_CODE') as Integer ?: 1
        versionName System.getenv('HC_VERSION_NAME') ?: 'dev'

        externalNativeBuild {
            cmake {
                // ANDROID_STL must be shared: SDL2, OpenAL and the client are
                // all separate .so files and pass C++ objects between them.
                arguments '-DANDROID_STL=c++_shared'

                // Both target devices (AYN Thor, Retroid Pocket 5) are arm64.
                // Building only this ABI keeps build times and APK size sane.
                abiFilters 'arm64-v8a'
            }
        }
    }

    externalNativeBuild {
        cmake {
            // The project root - the same CMakeLists the Switch build uses.
            path '../../CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            // SDL's Java shell comes from the submodule rather than being
            // duplicated here, so updating SDL updates the shell too.
            java.srcDirs += '../../libs/SDL2/android-project/app/src/main/java'
        }
    }

    // The release key never lives in this repository.
    //
    // CI writes it to a temporary file from a secret and points HC_KEYSTORE at
    // it. With no key configured there is no release signing config at all,
    // which is deliberate: an unsigned release APK cannot be installed, and
    // finding that out on release day is worse than being told here.
    signingConfigs {
        release {
            def store = System.getenv('HC_KEYSTORE')

            if (store) {
                storeFile file(store)
                storePassword System.getenv('HC_KEYSTORE_PASSWORD')
                keyAlias System.getenv('HC_KEY_ALIAS')
                keyPassword System.getenv('HC_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            if (System.getenv('HC_KEYSTORE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

// SPEECH TO TEXT, ON THE DEVICE.
//
// Vosk rather than Android's SpeechRecognizer, because the Thor answers
//
//     cmd package query-services android.speech.RecognitionService
//     No services found
//
// - there is no engine installed to talk to, and Google's wants the network
// anyway. Vosk runs a small model locally, which is the same promise the rest
// of this build makes: it works with the router unplugged.
//
// The MODEL is not here. It is ~40MB and not ours to ship on a release page;
// tools/deploy_data.sh puts it beside the .nx files. Without it SpeechInput
// reports itself unavailable and the microphone buttons stay quiet.
dependencies {
    implementation 'com.alphacephei:vosk-android:0.3.47@aar'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
}
