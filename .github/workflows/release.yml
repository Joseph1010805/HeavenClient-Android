# Build an APK when a version tag is pushed, and attach it to a Release.
#
#     git tag v0.7 && git push upstream-mine v0.7
#
# Only `v*` tags build. The repo also carries `latest` and `known-good-*` tags
# that mark states worth returning to, and those must not produce releases.
#
# NO GAME DATA IS INVOLVED. Nothing Nexon owns is in this repository or in the
# APK - the client reads its data from the device at runtime - so a clean CI
# checkout can build the app without any of it. Keep it that way.
name: release

on:
  push:
    tags:
      - 'v*'
  # So the build can be proven without spending a version number on it.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # SDL2, freetype, asio and openal-soft are submodules and the native
          # build cannot start without them. This is the step CI usually
          # forgets, and it fails deep inside CMake rather than here.
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ⚠ NOT THE DEFAULT PACKAGE LIST.
      #
      # setup-android asks for `tools platform-tools` unless told otherwise,
      # and `tools` - the obsolete SDK Tools package - has been REMOVED from
      # Google's repository. sdkmanager answers "Failed to find package
      # 'tools'" and exits 1, so the job dies before it has compiled a line.
      #
      # The same workflow built v0.9.1 on 15 September and failed on the same
      # step on 27 September with nothing changed in this file. Nothing here
      # needs `tools`; gradle uses platform-tools and the NDK.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # Seconds, and it runs BEFORE the twenty-minute native build.
      #
      # Windows does not care whether you wrote UIChatbar.h or UIChatBar.h.
      # Linux does, and this runner is Linux - so a mismatch compiles fine on
      # the machine it was written on and fails only here. That is precisely
      # how the first v0.7 build died, two and a half minutes into CMake.
      - name: Includes that only work on Windows
        run: python3 tools/check_includes.py

      - name: Work out the version from the tag
        id: version
        run: |
          REF="${GITHUB_REF_NAME}"

          if [[ "$REF" == v* ]]; then
            NAME="${REF#v}"
          else
            NAME="0.0-$(git rev-parse --short HEAD)"
          fi

          echo "name=$NAME" >> "$GITHUB_OUTPUT"

          # Monotonic and derived from history, so an older tag can never
          # produce a versionCode that outranks a newer one.
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

          echo "building $NAME (versionCode $(git rev-list --count HEAD))"

      - name: Unpack the signing key, if there is one
        id: signing
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "have_key=true" >> "$GITHUB_OUTPUT"
            echo "signing with the release key"
          else
            echo "have_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No RELEASE_KEYSTORE_BASE64 secret - building a DEBUG-signed APK."
            echo "::warning::It installs, but cannot upgrade an install signed with a different key."
          fi

      - name: Build
        env:
          HC_VERSION_NAME: ${{ steps.version.outputs.name }}
          HC_VERSION_CODE: ${{ steps.version.outputs.code }}
          HC_KEYSTORE: ${{ steps.signing.outputs.have_key == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          HC_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          HC_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          HC_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        working-directory: android
        run: |
          chmod +x gradlew

          if [ "${{ steps.signing.outputs.have_key }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
            echo "APK=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            ./gradlew --no-daemon assembleDebug
            echo "APK=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi

      - name: Name it after the version
        run: |
          mkdir -p out
          SUFFIX=""
          [ "${{ steps.signing.outputs.have_key }}" = "true" ] || SUFFIX="-debug-signed"
          cp "android/$APK" "out/LocalStory-${{ steps.version.outputs.name }}$SUFFIX.apk"
          ls -la out/

      # ⚠ THE INSTALLER IS NOT ONE FILE, AND THE PAGE USED TO PRETEND IT WAS.
      #
      # install.sh resolves its siblings - `bash "$HERE/tools/deploy_data.sh"`,
      # `"$HERE/tools/stage_server.sh"` - and stage_server.sh sends
      # termux_setup.sh and bootstrap.sh to the device. Attaching install.sh by
      # itself and saying "download it and run it" gives somebody a script that
      # installs the app and then dies on a file that was never beside it.
      #
      # v0.9 and v0.9.1 both shipped that promise. So the page carries the
      # whole of tools/ and the .bat as one zip, and says to use the zip.
      - name: The installer, as something that stands on its own
        run: |
          mkdir -p bundle
          cp INSTALL.bat bundle/
          cp -r tools bundle/
          rm -rf bundle/tools/__pycache__
          (cd bundle && zip -qr "../out/LocalStory-installer-${{ steps.version.outputs.name }}.zip" .)
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # THE INSTALLER SHIPS WITH THE APK. Somebody who lands on the
          # releases page and downloads only the APK has the app and no way
          # to put the game data on the device, which is most of the work -
          # and the README's "one command" does not say where that command
          # comes from. Attaching it here means the page is enough on its own.
          files: |
            out/*.apk
            out/*.zip
            tools/install.sh
          draft: true
          generate_release_notes: true
          body: |
            **Start with the installer zip,** not the APK. Download
            `LocalStory-installer-*.zip` below, unzip it, turn USB debugging
            on, plug the device in, and double-click **`INSTALL.bat`**. That is
            the whole install - it puts the app on the device and the game data
            where it belongs.

            On Mac or Linux there is no `.bat`: run `tools/install.sh` from the
            same unzipped folder. (`install.sh` is also attached on its own for
            reading, but it needs the rest of `tools/` beside it to run.)

            The APK is here for anyone who would rather install by hand; on
            its own it will start and then have nothing to read.

            **You supply your own game files.** There are none in this
            repository and none in the APK - see the README for what the app
            expects on the device and where it goes.

            ${{ steps.signing.outputs.have_key == 'true' && ' ' || '⚠ This build is DEBUG-SIGNED. It installs fine, but Android will refuse to upgrade an existing install that was signed with a different key - uninstall first if it complains.' }}
