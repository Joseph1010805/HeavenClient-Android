# Build an APK when a version tag is pushed, and attach it to a Release.
#
#     git tag v0.7 && git push upstream-mine v0.7
#
# Only `v*` tags build. The repo also carries `latest` and `known-good-*` tags
# that mark states worth returning to, and those must not produce releases.
#
# NO GAME DATA IS INVOLVED. Nothing Nexon owns is in this repository or in the
# APK - the client reads its data from the device at runtime - so a clean CI
# checkout can build the app without any of it. Keep it that way.
name: release

on:
  push:
    tags:
      - 'v*'
  # So the build can be proven without spending a version number on it.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # SDL2, freetype, asio and openal-soft are submodules and the native
          # build cannot start without them. This is the step CI usually
          # forgets, and it fails deep inside CMake rather than here.
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Work out the version from the tag
        id: version
        run: |
          REF="${GITHUB_REF_NAME}"

          if [[ "$REF" == v* ]]; then
            NAME="${REF#v}"
          else
            NAME="0.0-$(git rev-parse --short HEAD)"
          fi

          echo "name=$NAME" >> "$GITHUB_OUTPUT"

          # Monotonic and derived from history, so an older tag can never
          # produce a versionCode that outranks a newer one.
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

          echo "building $NAME (versionCode $(git rev-list --count HEAD))"

      - name: Unpack the signing key, if there is one
        id: signing
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "have_key=true" >> "$GITHUB_OUTPUT"
            echo "signing with the release key"
          else
            echo "have_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No RELEASE_KEYSTORE_BASE64 secret - building a DEBUG-signed APK."
            echo "::warning::It installs, but cannot upgrade an install signed with a different key."
          fi

      - name: Build
        env:
          HC_VERSION_NAME: ${{ steps.version.outputs.name }}
          HC_VERSION_CODE: ${{ steps.version.outputs.code }}
          HC_KEYSTORE: ${{ steps.signing.outputs.have_key == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          HC_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          HC_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          HC_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        working-directory: android
        run: |
          chmod +x gradlew

          if [ "${{ steps.signing.outputs.have_key }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
            echo "APK=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            ./gradlew --no-daemon assembleDebug
            echo "APK=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi

      - name: Name it after the version
        run: |
          mkdir -p out
          SUFFIX=""
          [ "${{ steps.signing.outputs.have_key }}" = "true" ] || SUFFIX="-debug-signed"
          cp "android/$APK" "out/LocalStory-${{ steps.version.outputs.name }}$SUFFIX.apk"
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          draft: true
          generate_release_notes: true
          body: |
            **You supply your own game files.** There are none in this
            repository and none in the APK - see the README for what the app
            expects on the device and where it goes.

            ${{ steps.signing.outputs.have_key == 'true' && ' ' || '⚠ This build is DEBUG-SIGNED. It installs fine, but Android will refuse to upgrade an existing install that was signed with a different key - uninstall first if it complains.' }}
